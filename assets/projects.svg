
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <rect width="900" height="390" rx="16" fill="url(#bg)" stroke="#334155"/>

  <!-- Terminal header -->
  <rect width="900" height="48" rx="16" fill="#1e293b"/>
  <path d="M0 32 V48 H900 V32" fill="#1e293b"/>

  <circle cx="25" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="45" cy="24" r="6" fill="#febc2e"/>
  <circle cx="65" cy="24" r="6" fill="#28c840"/>

  <text x="450" y="29" fill="#cbd5e1" font-family="monospace" font-size="14" text-anchor="middle">
    armando@github: ~/projects
  </text>

  <!-- Terminal content -->
  <g font-family="monospace" font-size="15">
    <text x="30" y="85" fill="#4ade80">$</text>
    <text x="48" y="85" fill="#e2e8f0"> loading latest projects...</text>

    <text x="30" y="125" fill="#60a5fa">[01]</text>
    <text x="85" y="125" fill="#f8fafc" font-weight="bold">Guardrail</text>
    <text x="85" y="148" fill="#94a3b8" font-size="12">OpenStack Compliance &amp; Security Plugin</text>
    <text x="85" y="168" fill="#4ade80" font-size="12">Python | OpenStack | Nova | Neutron | Flask</text>

    <text x="30" y="210" fill="#60a5fa">[02]</text>
    <text x="85" y="210" fill="#f8fafc">Progetto_AI</text>
    <text x="85" y="233" fill="#94a3b8" font-size="12">Artificial Intelligence project</text>

    <text x="30" y="275" fill="#60a5fa">[03]</text>
    <text x="85" y="275" fill="#f8fafc">GLTSegnaletica</text>
    <text x="85" y="298" fill="#94a3b8" font-size="12">University project</text>

  </g>

  <!-- Cursor animation -->
  <rect x="330" y="72" width="9" height="17" fill="#4ade80">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
